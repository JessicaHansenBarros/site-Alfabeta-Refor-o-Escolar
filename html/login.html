<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do educador - Alfabeta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inder&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <header>
        <link rel="stylesheet" href="../css/header.css">
        <section class="logo">
            <img src="../assets/imagens/logo alfabeta.png" alt="logo alfabeta">
        </section>
    </header>
    <section class="portal">
    <img src="../assets/imagens/Gemini_Generated_Image_n6afk8n6afk8n6af 1.png" alt="fundo site">
    <div class="banner-conteudo">
        <h1>
            Portal do educador
        </h1>
    </div>

</section>

    <main class="container-login">
    <form class="card-login">
        <div class="campo-grupo">
            <label for="login">Login:</label>
            <input type="text" id="login" name="login" required>
        </div>

        <div class="campo-grupo">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
        </div>

        <button type="submit" class="btn-logar">Logar</button>

        <p class="texto-cadastro">
            Novo aqui? <a href="#">Criar conta</a>
        </p>
    </form>
</main>
    
</body>
</html>
